apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployment-demo

spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deploy-demo
  template:
    metadata:
      labels:
        app: deploy-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          env:
            - name: DEMO_VERSION
              value: "v3"
