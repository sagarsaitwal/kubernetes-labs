apiVersion: v1
kind: Pod

metadata:
  name: multi-container-demo

spec:
  volumes:
    - name: shared-data
      emptyDir: {}

  initContainers:
    - name: setup
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo 'written by init container' > /work/index.html
      volumeMounts:
        - name: shared-data
          mountPath: /work

    - name: log-sidecar
      image: busybox:1.36
      restartPolicy: Always
      command:
        - sh
        - -c
        - while true; do echo sidecar alive at $(date); sleep 5; done

  containers:
    - name: nginx
      image: nginx:1.27-alpine
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
